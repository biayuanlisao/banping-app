name: Build BanPing APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -o BanPing-source.zip -d ./src

      - name: 打印src目录
        run: ls ./src

      - name: 打印BanPing内部文件
        run: ls ./src/BanPing

      - name: 移动文件
        run: cp -r ./src/BanPing/* ./

      - name: 打印当前根目录全部文件
        run: ls -la

      - name: 检查gradlew
        run: ls -la gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: banping-apk
          path: app/build/outputs/apk/debug/app-debug.apk
